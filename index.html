<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#e23b2e" />
  <title>Cardápio · Pizzaria Delivery</title>
  <meta name="description" content="Peça sua pizza online — cardápio digital rápido e direto pelo WhatsApp." />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="assets/manifest.webmanifest" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#fef2f1", 100: "#fde0dd", 200: "#fbc4bf", 300: "#f79a91",
              400: "#f16457", 500: "#e23b2e", 600: "#c72c20", 700: "#a5231a",
              800: "#88211a", 900: "#71211c",
            },
            charcoal: {
              50: "#f7f7f8", 100: "#eeeef0", 200: "#d9d9de", 300: "#b8b8c0",
              400: "#8f8f9c", 500: "#6f6f7e", 600: "#565664", 700: "#434350",
              800: "#2c2c37", 900: "#18181b",
            },
          },
        },
      },
    };
  </script>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"
    }
  }
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-charcoal-50 text-charcoal-900 min-h-screen">

  <!-- Header -->
  <header class="bg-white sticky top-0 z-40 shadow-sm">
    <div class="max-w-lg mx-auto px-4 pt-3 pb-2">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h1 id="storeName" class="text-lg font-extrabold truncate">Pizzaria Delivery</h1>
          <p id="storeAddress" class="text-xs text-charcoal-500 truncate"></p>
        </div>
        <span id="storeStatus" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-charcoal-100 text-charcoal-500 shrink-0">carregando…</span>
      </div>
      <p id="storeEta" class="text-[11px] text-charcoal-400 mt-0.5"></p>

      <div class="mt-2.5 relative">
        <input id="search" type="search" placeholder="Buscar no cardápio…" enterkeyhint="search"
          class="w-full bg-charcoal-100 rounded-xl py-2.5 pl-9 pr-3 text-sm outline-none focus:bg-white focus:ring-2 focus:ring-brand-200" />
        <svg class="w-4 h-4 absolute left-3 top-3 text-charcoal-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
    </div>

    <nav id="catNav" class="cat-scroll max-w-lg mx-auto px-4 pb-2.5 flex gap-2 overflow-x-auto"></nav>
  </header>

  <!-- Cardápio -->
  <main id="menu" class="max-w-lg mx-auto px-4 pb-32"></main>

  <!-- Barra de carrinho flutuante -->
  <div id="cartBar" class="fixed bottom-0 inset-x-0 z-40 translate-y-24 pointer-events-none">
    <div class="max-w-lg mx-auto px-4">
      <button class="pointer-events-auto w-full bg-brand-600 text-white rounded-2xl shadow-lg shadow-brand-600/30 h-14 px-5 flex items-center justify-between font-bold">
        <span id="cartBarCount">0 itens</span>
        <span class="flex items-center gap-2">Ver pedido <span id="cartBarTotal">R$ 0,00</span> ›</span>
      </button>
    </div>
  </div>

  <footer class="max-w-lg mx-auto px-4 py-8 text-center text-[11px] text-charcoal-400">
    Feito com 🍕 · Pedidos via WhatsApp · <a href="/admin" class="underline">Painel</a>
  </footer>

  <div id="print-receipt" aria-hidden="true"></div>

  <script type="module">
    import { initMenu } from "./js/menu.js";
    initMenu();
  </script>
</body>
</html>
